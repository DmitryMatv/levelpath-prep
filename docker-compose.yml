services:
  db:
    image: postgres:17-alpine
    container_name: levelpath-prep-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TENANT_APP_PASSWORD: ${TENANT_APP_PASSWORD}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro  # this will run the SQL scripts in the init folder when the container is first created
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: levelpath-prep-api
    ports:
      - '${API_PORT:-3000}:3000'
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB}
      TENANT_APP_USER: ${TENANT_APP_USER}
      TENANT_APP_PASSWORD: ${TENANT_APP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
